[package]
name = "bplist"
version = "0.1.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/igankevich/bplist"
repository = "https://github.com/igankevich/bplist"
documentation = "https://docs.rs/bplist"
readme = "README.md"
description = "Binary property list reader/writer."
keywords = ["plist"]
categories = ["encoding"]
include = ["**/*.rs", "Cargo.toml", "README.md"]

[features]
default = ["std"]
std = ["serde/std"]

[dependencies]
paste = "1.0.15"
serde = { version = "1.0.228", default-features = false, features = ["alloc"] }

[dev-dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
arbtest = "0.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"

[lints.rust]
missing_docs = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
